name: Playwright Tests

on:
  push:
    branches: [master, release]
  pull_request:
    branches: [master, release]
  schedule:
    - cron: '0 13 * * *'
  workflow_dispatch:
    inputs:
      suite:
        description: 'Test suite to run'
        required: false
        default: 'smoke'
        type: choice
        options: [smoke, regression, all]

permissions:
  contents: read
  issues: write

jobs:
  smoke:
    name: Smoke Tests
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run smoke tests
        env:
          BASE_URL: https://staging.angleyou.com
          GATE_PASSWORD: ${{ secrets.GATE_PASSWORD }}
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          STRIPE_TEST_CARD: 4242424242424242
          STRIPE_TEST_EXPIRY: 12/26
          STRIPE_TEST_CVC: 123
          PLAYWRIGHT_HTML_OUTPUT_DIR: reports/html
        run: npx playwright test --grep @smoke --project=chromium --reporter=github,html

      - name: Find report files
        if: always()
        run: find . -name "index.html" -path "*/html/*" 2>/dev/null || echo "No HTML report found"

      - name: Upload report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-report
          path: reports/html/
          retention-days: 7

