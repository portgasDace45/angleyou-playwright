# .github/workflows/playwright.yml
# Runs on every push to main and on PRs.
# Smoke suite runs fast; full regression runs nightly or on manual trigger.

name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Full regression nightly at 2am NZT (1pm UTC)
    - cron: '0 13 * * *'
  workflow_dispatch:
    inputs:
      suite:
        description: 'Test suite to run'
        required: false
        default: 'smoke'
        type: choice
        options: [smoke, regression, all]

jobs:
  smoke:
    name: Smoke Tests
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'e2e/package-lock.json'

      - name: Install dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run smoke tests (Chromium only)
        working-directory: e2e
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          GATE_PASSWORD: ${{ secrets.GATE_PASSWORD }}
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          STRIPE_TEST_CARD: ${{ secrets.STRIPE_TEST_CARD }}
          STRIPE_TEST_EXPIRY: ${{ secrets.STRIPE_TEST_EXPIRY }}
          STRIPE_TEST_CVC: ${{ secrets.STRIPE_TEST_CVC }}
        run: |
          npx playwright test --grep @smoke --project=chromium \
            --reporter=github,html

      - name: Upload report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-report
          path: e2e/reports/html/
          retention-days: 7

  regression:
    name: Full Regression
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.suite != 'smoke')
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'e2e/package-lock.json'

      - name: Install dependencies
        working-directory: e2e
        run: npm ci

      - name: Install all Playwright browsers
        working-directory: e2e
        run: npx playwright install --with-deps

      - name: Run full regression suite
        working-directory: e2e
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          GATE_PASSWORD: ${{ secrets.GATE_PASSWORD }}
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          STRIPE_TEST_CARD: ${{ secrets.STRIPE_TEST_CARD }}
          STRIPE_TEST_EXPIRY: ${{ secrets.STRIPE_TEST_EXPIRY }}
          STRIPE_TEST_CVC: ${{ secrets.STRIPE_TEST_CVC }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
        run: npx playwright test --grep @regression --reporter=github,html

      - name: Upload report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regression-report-${{ github.run_number }}
          path: e2e/reports/html/
          retention-days: 30

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🔴 Regression suite failed — ${new Date().toISOString().split('T')[0]}`,
              body: `Full regression run #${context.runNumber} failed.\n\nSee: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['bug', 'automated-test']
            })
